name: Module development
description: Register a module through the standard lifecycle
title: "[module] "
labels: [module]
body:
  - type: input
    id: module
    attributes:
      label: Module
      description: Module name and link to the unique module specification.
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: Ownership and isolation
      description: Owner, reviewer, branch, worktree, allowed directories, ports and dev/test/e2e database names.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Goal and scope
      description: Include, explicitly exclude, user roles and dependencies.
    validations:
      required: true
  - type: textarea
    id: matrix
    attributes:
      label: Feature matrix
      description: Link a completed functional coverage matrix and identify P0/P1/P2.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include UI, data logic, API, permission, responsive and test requirements.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Research and confirmation evidence
      description: Add TradeZella research, requirement decision, Mock confirmation and API contract links as they become available.
    validations:
      required: true
  - type: textarea
    id: serial_resources
    attributes:
      label: Shared and serial resources
      description: Navigation, tokens, lock files, migrations, shared contracts and integration dependencies.
  - type: textarea
    id: blockers
    attributes:
      label: Dependencies and blockers
      description: State the blocker, next action and responsible person.
