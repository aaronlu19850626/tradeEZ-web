name: Bug report
description: Report a reproducible defect
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give exact steps, environment, expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add logs, screenshots, traces or failing test names. Remove secrets and personal data.
  - type: textarea
    id: impact
    attributes:
      label: Impact and regression scope
    validations:
      required: true
